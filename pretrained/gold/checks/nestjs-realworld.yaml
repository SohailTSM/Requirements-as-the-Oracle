# Gold atomic checks (Claude-drafted from PRECISE requirements), NestJS RealWorld.
1:
  - {kind: status, check: "create user returns 201"}
  - {kind: field, check: "returned username equals 'testuser123'"}
  - {kind: field, check: "returned email equals 'test@example.com'"}
  - {kind: presence, check: "returned token is non-empty"}
  - {kind: status, check: "GET /user with the token returns 200"}
  - {kind: field, check: "current user username and email match the created user"}
2:
  - {kind: status, check: "follow returns 201"}
  - {kind: field, check: "returned profile following is true and username is the followee"}
  - {kind: side_effect, check: "GET profile afterwards shows following true"}
  - {kind: status, check: "following yourself returns 400"}
  - {kind: message, check: "self-follow error message contains 'cannot be equal'"}
3:
  - {kind: status, check: "create article returns 201"}
  - {kind: field, check: "returned title and description equal the input"}
  - {kind: membership, check: "returned tagList contains 'testing' and 'nestjs'"}
  - {kind: field, check: "slug starts with 'my-test-article-'"}
  - {kind: side_effect, check: "GET article by slug returns 200 with the same title"}
4:
  - {kind: status, check: "update article returns 200"}
  - {kind: field, check: "returned title and description equal the new values"}
  - {kind: field, check: "slug is unchanged"}
  - {kind: side_effect, check: "GET by the original slug shows the updated values"}
5:
  - {kind: side_effect, check: "article can be retrieved before deletion"}
  - {kind: status, check: "delete article returns 200"}
  - {kind: side_effect, check: "GET after deletion returns 200 with an empty object"}
6:
  - {kind: field, check: "feed articlesCount is 0 before following anyone"}
  - {kind: field, check: "after following, feed articlesCount is 1"}
  - {kind: membership, check: "feed contains the followed author's article"}
  - {kind: membership, check: "feed does not contain the non-followed author's article"}
7:
  - {kind: status, check: "create comment returns 200"}
  - {kind: field, check: "returned article has at least one comment"}
  - {kind: status, check: "GET comments returns 200"}
  - {kind: membership, check: "comments contain one with the posted body"}
  - {kind: field, check: "comment id is a number"}
8:
  - {kind: field, check: "article has 1 comment before deletion"}
  - {kind: status, check: "delete comment returns 200"}
  - {kind: membership, check: "comments afterwards do not contain the deleted comment"}
9:
  - {kind: status, check: "first user creation returns 201"}
  - {kind: status, check: "duplicate username returns 400"}
  - {kind: message, check: "duplicate-username response contains 'Username and email must be unique'"}
  - {kind: status, check: "duplicate email returns 400"}
  - {kind: message, check: "duplicate-email response contains 'Username and email must be unique'"}
10:
  - {kind: field, check: "following is true after follow"}
  - {kind: status, check: "unfollow returns 200"}
  - {kind: field, check: "unfollow response has following false"}
  - {kind: side_effect, check: "GET profile afterwards shows following false"}
  - {kind: status, check: "unfollowing yourself returns 400"}
11:
  - {kind: status, check: "login with correct password returns 201"}
  - {kind: field, check: "login response user email and username match"}
  - {kind: presence, check: "login response has a token"}
  - {kind: status, check: "login with wrong password returns 401"}
12:
  - {kind: field, check: "tag=javascript gives articlesCount 1 with only 'First Tagged Article'"}
  - {kind: field, check: "tag=testing gives articlesCount 2 with both tagged articles"}
  - {kind: field, check: "unknown tag gives articlesCount 0"}
13:
  - {kind: field, check: "author=author1 gives articlesCount 1 with only author1's article"}
  - {kind: field, check: "author=author2 gives articlesCount 1 with only author2's article"}
  - {kind: field, check: "no filter gives articlesCount 2"}
14:
  - {kind: status, check: "update user returns 200"}
  - {kind: field, check: "returned bio and image equal the new values"}
  - {kind: side_effect, check: "GET /user afterwards shows the updated bio and image"}
15:
  - {kind: field, check: "limit=2 gives articlesCount 5 and 2 articles"}
  - {kind: field, check: "limit=2&offset=2 gives 2 articles different from the first page"}
  - {kind: field, check: "limit=10 gives all 5 articles"}
16:
  - {kind: field, check: "profile shows following false before following"}
  - {kind: field, check: "after follow, profile shows following true and the right username"}
  - {kind: field, check: "after unfollow, profile shows following false again"}
17:
  - {kind: field, check: "author=articleauthor1 gives articlesCount 1 with only 'User1 Article'"}
  - {kind: field, check: "author=articleauthor2 gives articlesCount 1 with only 'User2 Article'"}
18:
  - {kind: field, check: "article tagList is exactly ['tag1', 'tag2', 'tag3']"}
  - {kind: field, check: "article created with empty tagList returns an empty tagList"}
19:
  - {kind: field, check: "created timestamp unchanged after update"}
  - {kind: field, check: "updated timestamp is newer after update"}
20:
  - {kind: status, check: "both articles with the same title return 201"}
  - {kind: field, check: "the two slugs are different"}
  - {kind: field, check: "both slugs start with 'duplicate-title-article-'"}
21:
  - {kind: field, check: "retrieved title equals 'Test Article Title'"}
  - {kind: field, check: "retrieved description equals 'Test article description content'"}
22:
  - {kind: field, check: "profile username equals 'profilebiouser1'"}
  - {kind: field, check: "profile bio and image equal the updated values"}
23:
  - {kind: field, check: "feed limit=2 gives articlesCount 5 and 2 articles"}
  - {kind: field, check: "feed limit=2&offset=2 gives 2 different articles"}
24:
  - {kind: field, check: "articles are ordered by created timestamp, newest first"}
25:
  - {kind: field, check: "JWT payload id matches the user's id"}
  - {kind: field, check: "JWT payload username and email match the user"}
  - {kind: side_effect, check: "GET /user with the token returns the same user"}
26:
  - {kind: field, check: "GET comments returns 3 comments"}
  - {kind: field, check: "comment ids are unique"}
  - {kind: field, check: "comment bodies are preserved"}
27:
  - {kind: field, check: "feed of a user who follows nobody has articlesCount 0 and an empty articles array"}
28:
  - {kind: field, check: "non-owner update response shows the new title"}
  - {kind: side_effect, check: "GET shows the title changed"}
  - {kind: status, check: "non-owner delete returns 200"}
  - {kind: side_effect, check: "GET deleted article returns 200 with an empty object"}
29:
  - {kind: membership, check: "article list contains the article with author 'orphanauthor1'"}
  - {kind: status, check: "deleting the author user returns 500"}
  - {kind: side_effect, check: "the article still exists afterwards"}
