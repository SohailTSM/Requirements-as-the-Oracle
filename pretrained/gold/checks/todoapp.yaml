# Gold atomic checks (Claude-drafted from PRECISE requirements), TodoApp.
1:
  - {kind: field, check: "userA's GET /todos returns exactly one todo"}
  - {kind: membership, check: "userA's list contains 'UserA Todo'"}
  - {kind: membership, check: "userA's list does not contain 'UserB Todo'"}
2:
  - {kind: status, check: "creating a todo without a title returns 400"}
  - {kind: message, check: "error contains 'The Title field is required.'"}
3:
  - {kind: status, check: "GET todo by id returns 200"}
  - {kind: field, check: "returned id equals the created id"}
  - {kind: field, check: "returned title equals 'My Test Todo'"}
  - {kind: field, check: "isComplete is false"}
4:
  - {kind: status, check: "GET non-existent todo returns 404"}
5:
  - {kind: status, check: "userB getting userA's todo returns 404"}
6:
  - {kind: status, check: "delete todo returns 200"}
  - {kind: side_effect, check: "GET the deleted todo returns 404"}
7:
  - {kind: status, check: "delete non-existent todo returns 404"}
8:
  - {kind: status, check: "userB deleting userA's todo returns 404"}
  - {kind: side_effect, check: "userA's todo still exists (GET returns 200)"}
9:
  - {kind: status, check: "update todo returns 200"}
  - {kind: side_effect, check: "GET afterwards shows isComplete true"}
  - {kind: side_effect, check: "GET afterwards shows title 'Updated Todo'"}
10:
  - {kind: status, check: "PUT with a body id different from the path id returns 400"}
11:
  - {kind: status, check: "updating a non-existent todo returns 404"}
12:
  - {kind: status, check: "userB updating userA's todo returns 404"}
  - {kind: side_effect, check: "userA's todo title is still 'UserA Todo'"}
13:
  - {kind: status, check: "register returns 200"}
  - {kind: presence, check: "login with the same credentials returns a token"}
14:
  - {kind: status, check: "GET /todos without a token returns 401"}
