  - {agent_config: configs/agent/final__runner_selfcons.yaml, variant: precise, rep: 2, services: [nestjs-realworld], exp_id: ours_runner_selfcons__precise__rep2__nestjs-realworld}
  - {agent_config: configs/agent/final__runner_selfcons.yaml, variant: precise, rep: 2, services: [todoapp], exp_id: ours_runner_selfcons__precise__rep2__todoapp}
  - {agent_config: configs/agent/final__runner_selfcons.yaml, variant: precise, rep: 3, services: [fastapi], exp_id: ours_runner_selfcons__precise__rep3__fastapi}
  - {agent_config: configs/agent/final__runner_selfcons.yaml, variant: precise, rep: 3, services: [nestjs-realworld], exp_id: ours_runner_selfcons__precise__rep3__nestjs-realworld}
  - {agent_config: configs/agent/final__runner_selfcons.yaml, variant: precise, rep: 3, services: [todoapp], exp_id: ours_runner_selfcons__precise__rep3__todoapp}
