# Finals and ablations of our agent (Plan §5 B, C; Decision Log D-118). All 3 services, one job per service
# (the runner splits FastAPI into time-fit parts). Order = priority: final vague, final precise, runner-ups,
# then ablations (final configuration minus one component, vague, 1 run).
#   .venv/bin/python scripts/run_queue.py configs/queue_finals.yaml
max_parallel: 12
defaults:
  group: finals
  tool: ours

jobs:
  # final, vague
  - {agent_config: configs/agent/final.yaml, variant: vague, rep: 1, services: [fastapi], exp_id: ours_final__vague__rep1__fastapi}
  - {agent_config: configs/agent/final.yaml, variant: vague, rep: 1, services: [nestjs-realworld], exp_id: ours_final__vague__rep1__nestjs-realworld}
  - {agent_config: configs/agent/final.yaml, variant: vague, rep: 1, services: [todoapp], exp_id: ours_final__vague__rep1__todoapp}
  - {agent_config: configs/agent/final.yaml, variant: vague, rep: 2, services: [fastapi], exp_id: ours_final__vague__rep2__fastapi}
  - {agent_config: configs/agent/final.yaml, variant: vague, rep: 2, services: [nestjs-realworld], exp_id: ours_final__vague__rep2__nestjs-realworld}
  - {agent_config: configs/agent/final.yaml, variant: vague, rep: 2, services: [todoapp], exp_id: ours_final__vague__rep2__todoapp}
  - {agent_config: configs/agent/final.yaml, variant: vague, rep: 3, services: [fastapi], exp_id: ours_final__vague__rep3__fastapi}
  - {agent_config: configs/agent/final.yaml, variant: vague, rep: 3, services: [nestjs-realworld], exp_id: ours_final__vague__rep3__nestjs-realworld}
  - {agent_config: configs/agent/final.yaml, variant: vague, rep: 3, services: [todoapp], exp_id: ours_final__vague__rep3__todoapp}
  # final, precise
  - {agent_config: configs/agent/final.yaml, variant: precise, rep: 1, services: [fastapi], exp_id: ours_final__precise__rep1__fastapi}
  - {agent_config: configs/agent/final.yaml, variant: precise, rep: 1, services: [nestjs-realworld], exp_id: ours_final__precise__rep1__nestjs-realworld}
  - {agent_config: configs/agent/final.yaml, variant: precise, rep: 1, services: [todoapp], exp_id: ours_final__precise__rep1__todoapp}
  - {agent_config: configs/agent/final.yaml, variant: precise, rep: 2, services: [fastapi], exp_id: ours_final__precise__rep2__fastapi}
  - {agent_config: configs/agent/final.yaml, variant: precise, rep: 2, services: [nestjs-realworld], exp_id: ours_final__precise__rep2__nestjs-realworld}
  - {agent_config: configs/agent/final.yaml, variant: precise, rep: 2, services: [todoapp], exp_id: ours_final__precise__rep2__todoapp}
  - {agent_config: configs/agent/final.yaml, variant: precise, rep: 3, services: [fastapi], exp_id: ours_final__precise__rep3__fastapi}
  - {agent_config: configs/agent/final.yaml, variant: precise, rep: 3, services: [nestjs-realworld], exp_id: ours_final__precise__rep3__nestjs-realworld}
  - {agent_config: configs/agent/final.yaml, variant: precise, rep: 3, services: [todoapp], exp_id: ours_final__precise__rep3__todoapp}
  # runner_content, vague
