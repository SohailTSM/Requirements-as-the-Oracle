  - {tool: e_fuzzer, variant: vague, rep: 1, services: [todoapp], exp_id: e_fuzzer__vague__rep1__todoapp}
  - {tool: e_fuzzer, variant: vague, rep: 1, services: [fastapi], exp_id: e_fuzzer__vague__rep1__fastapi}
  - {tool: e_fuzzer, variant: vague, rep: 2, services: [nestjs-realworld], exp_id: e_fuzzer__vague__rep2__nestjs-realworld}
  - {tool: e_fuzzer, variant: vague, rep: 2, services: [todoapp], exp_id: e_fuzzer__vague__rep2__todoapp}
  - {tool: e_fuzzer, variant: vague, rep: 2, services: [fastapi], exp_id: e_fuzzer__vague__rep2__fastapi}
  - {tool: e_fuzzer, variant: vague, rep: 3, services: [nestjs-realworld], exp_id: e_fuzzer__vague__rep3__nestjs-realworld}
  - {tool: e_fuzzer, variant: vague, rep: 3, services: [todoapp], exp_id: e_fuzzer__vague__rep3__todoapp}
  - {tool: e_fuzzer, variant: vague, rep: 3, services: [fastapi], exp_id: e_fuzzer__vague__rep3__fastapi}

  # B4 response judge (planner frozen since D-95). timeout 600: each test waits for an LLM verdict (D-74).
