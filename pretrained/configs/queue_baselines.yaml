  - {tool: b3_prompt_fixed, variant: vague, rep: 2, services: [todoapp], exp_id: b3_prompt_fixed__vague__rep2__todoapp}
  - {tool: b3_prompt_fixed, variant: vague, rep: 2, services: [fastapi], exp_id: b3_prompt_fixed__vague__rep2__fastapi}

  - {tool: b2_refinement, variant: precise, rep: 2, services: [nestjs-realworld], exp_id: b2_refinement__precise__rep2__nestjs-realworld}
  - {tool: b2_refinement, variant: precise, rep: 2, services: [todoapp], exp_id: b2_refinement__precise__rep2__todoapp}
  - {tool: b2_refinement, variant: precise, rep: 2, services: [fastapi], exp_id: b2_refinement__precise__rep2__fastapi}

  - {tool: b3_prompt_fixed, variant: precise, rep: 2, services: [nestjs-realworld], exp_id: b3_prompt_fixed__precise__rep2__nestjs-realworld}
  - {tool: b3_prompt_fixed, variant: precise, rep: 2, services: [todoapp], exp_id: b3_prompt_fixed__precise__rep2__todoapp}
  - {tool: b3_prompt_fixed, variant: precise, rep: 2, services: [fastapi], exp_id: b3_prompt_fixed__precise__rep2__fastapi}

  - {tool: b2_refinement, variant: vague, rep: 3, services: [nestjs-realworld], exp_id: b2_refinement__vague__rep3__nestjs-realworld}
  - {tool: b2_refinement, variant: vague, rep: 3, services: [todoapp], exp_id: b2_refinement__vague__rep3__todoapp}
  - {tool: b2_refinement, variant: vague, rep: 3, services: [fastapi], exp_id: b2_refinement__vague__rep3__fastapi}

  - {tool: b3_prompt_fixed, variant: vague, rep: 3, services: [nestjs-realworld], exp_id: b3_prompt_fixed__vague__rep3__nestjs-realworld}
  - {tool: b3_prompt_fixed, variant: vague, rep: 3, services: [todoapp], exp_id: b3_prompt_fixed__vague__rep3__todoapp}
  - {tool: b3_prompt_fixed, variant: vague, rep: 3, services: [fastapi], exp_id: b3_prompt_fixed__vague__rep3__fastapi}

  - {tool: b2_refinement, variant: precise, rep: 3, services: [nestjs-realworld], exp_id: b2_refinement__precise__rep3__nestjs-realworld}
  - {tool: b2_refinement, variant: precise, rep: 3, services: [todoapp], exp_id: b2_refinement__precise__rep3__todoapp}
  - {tool: b2_refinement, variant: precise, rep: 3, services: [fastapi], exp_id: b2_refinement__precise__rep3__fastapi}

  - {tool: b3_prompt_fixed, variant: precise, rep: 3, services: [nestjs-realworld], exp_id: b3_prompt_fixed__precise__rep3__nestjs-realworld}
  - {tool: b3_prompt_fixed, variant: precise, rep: 3, services: [todoapp], exp_id: b3_prompt_fixed__precise__rep3__todoapp}
  - {tool: b3_prompt_fixed, variant: precise, rep: 3, services: [fastapi], exp_id: b3_prompt_fixed__precise__rep3__fastapi}

  # E fuzzer (no LLM, Schemathesis; seed = rep). Decision Log D-50 / D-65.
