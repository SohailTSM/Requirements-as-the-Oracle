  - {tool: b2_refinement, variant: vague, rep: 1, services: [fastapi], exp_id: b2_refinement__vague__rep1__fastapi}

  - {tool: b3_prompt_fixed, variant: vague, rep: 1, services: [nestjs-realworld], exp_id: b3_prompt_fixed__vague__rep1__nestjs-realworld}
  - {tool: b3_prompt_fixed, variant: vague, rep: 1, services: [todoapp], exp_id: b3_prompt_fixed__vague__rep1__todoapp}
  - {tool: b3_prompt_fixed, variant: vague, rep: 1, services: [fastapi], exp_id: b3_prompt_fixed__vague__rep1__fastapi}

  - {tool: b2_refinement, variant: precise, rep: 1, services: [nestjs-realworld], exp_id: b2_refinement__precise__rep1__nestjs-realworld}
  - {tool: b2_refinement, variant: precise, rep: 1, services: [todoapp], exp_id: b2_refinement__precise__rep1__todoapp}
  - {tool: b2_refinement, variant: precise, rep: 1, services: [fastapi], exp_id: b2_refinement__precise__rep1__fastapi}

  - {tool: b3_prompt_fixed, variant: precise, rep: 1, services: [nestjs-realworld], exp_id: b3_prompt_fixed__precise__rep1__nestjs-realworld}
  - {tool: b3_prompt_fixed, variant: precise, rep: 1, services: [todoapp], exp_id: b3_prompt_fixed__precise__rep1__todoapp}
  - {tool: b3_prompt_fixed, variant: precise, rep: 1, services: [fastapi], exp_id: b3_prompt_fixed__precise__rep1__fastapi}

  - {tool: b2_refinement, variant: vague, rep: 2, services: [nestjs-realworld], exp_id: b2_refinement__vague__rep2__nestjs-realworld}
  - {tool: b2_refinement, variant: vague, rep: 2, services: [todoapp], exp_id: b2_refinement__vague__rep2__todoapp}
  - {tool: b2_refinement, variant: vague, rep: 2, services: [fastapi], exp_id: b2_refinement__vague__rep2__fastapi}

