# Component sweep: FastAPI, vague, 1 run per configuration (Plan §5 A; D-35).
# Not started yet: run after the default configuration is final (target Tue 27 Oct).
#   .venv/bin/python scripts/run_queue.py configs/queue_sweep.yaml
# Rows needing fine-tuned models (precision finetuned, model sft / sft_dpo) are last (D-70, D-73).
max_parallel: 12
